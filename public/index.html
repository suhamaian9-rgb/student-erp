<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — College ERP Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="login-wrapper">
    <div class="card login-card p-4 p-md-5">
      <div class="text-center mb-4">
        <span class="brand-badge mb-3"><i class="bi bi-mortarboard-fill"></i></span>
        <h1 class="h4 fw-bold mb-1">College ERP Portal</h1>
        <p class="text-muted small mb-0">Sign in with your university email and password</p>
      </div>

      <div id="login-alert" class="alert d-none" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label fw-medium">Email Address</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="email" placeholder="name@university.edu" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label fw-medium">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember-me" checked>
            <label class="form-check-label small" for="remember-me">Keep me signed in</label>
          </div>
          <a href="#" class="small text-decoration-none" data-bs-toggle="modal" data-bs-target="#forgotModal">
            Forgot password?
          </a>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary w-100 py-2 fw-medium">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>
      </form>

      <hr class="my-4">
      <p class="text-center text-muted small mb-0">
        Roles: <strong>Admin / HOD</strong> &bull; <strong>Teacher</strong> &bull; <strong>Student</strong>
      </p>
    </div>
  </div>

  <!-- Password Reset Modal -->
  <div class="modal fade" id="forgotModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Reset Password</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="forgot-form">
          <div class="modal-body">
            <p class="small text-muted">Enter your registered email address and we will send you a password reset link.</p>
            <div id="forgot-alert" class="alert d-none"></div>
            <label for="reset-email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="reset-email" required placeholder="name@university.edu">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="submit" class="btn btn-primary">Send Reset Link</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/app.js"></script>
  <script>
    const alertBox = document.getElementById("login-alert");
    const loginForm = document.getElementById("login-form");
    const loginBtn = document.getElementById("login-btn");

    function showAlert(el, msg, type = "danger") {
      el.className = `alert alert-${type}`;
      el.textContent = msg;
      el.classList.remove("d-none");
    }

    async function redirectByRole() {
      const me = await ERP.api("/api/me");
      const role = me.profile.role;
      if (role === "admin") window.location.href = "/admin.html";
      else if (role === "teacher") window.location.href = "/teacher.html";
      else window.location.href = "/student.html";
    }

    (async () => {
      try {
        const sb = await ERP.initSupabase();
        const { data } = await sb.auth.getSession();
        if (data.session) {
          await redirectByRole();
        }
      } catch (err) {
        showAlert(alertBox, err.message);
      }
    })();

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.classList.add("d-none");
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        showAlert(alertBox, "Please enter both email and password.");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Signing in...`;

      try {
        const sb = await ERP.initSupabase();
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        await redirectByRole();
      } catch (err) {
        showAlert(alertBox, err.message || "Invalid email or password.");
        loginBtn.disabled = false;
        loginBtn.innerHTML = `<i class="bi bi-box-arrow-in-right me-1"></i> Sign In`;
      }
    });

    document.getElementById("forgot-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const forgotAlert = document.getElementById("forgot-alert");
      const email = document.getElementById("reset-email").value.trim();
      try {
        const sb = await ERP.initSupabase();
        const { error } = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: `${window.location.origin}/reset-password.html`,
        });
        if (error) throw error;
        showAlert(forgotAlert, "Password reset email sent! Check your inbox.", "success");
      } catch (err) {
        showAlert(forgotAlert, err.message);
      }
    });
  </script>
</body>
</html>
