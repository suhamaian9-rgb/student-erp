<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College ERP Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f6f9;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .hero-card {
      max-width: 640px;
      margin: 5rem auto;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    .brand-icon {
      width: 56px;
      height: 56px;
      background-color: #0d6efd;
      color: #fff;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
    }
  </style>
</head>
<body>
  <div class="container px-3">
    <div class="card hero-card p-4 p-md-5 text-center">
      <div class="mb-3">
        <span class="brand-icon"><i class="bi bi-mortarboard-fill"></i></span>
      </div>
      <h1 class="h3 fw-bold mb-2">College ERP Management System</h1>
      <p class="text-muted mb-4">
        University Portal for Administration, Faculty, and Students
      </p>

      <div id="status-box" class="alert alert-secondary d-flex align-items-center justify-content-center gap-2 mb-4" role="alert">
        <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        <span>Checking backend API status...</span>
      </div>

      <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
        <a href="/api/health" class="btn btn-outline-primary">
          <i class="bi bi-heart-pulse me-1"></i> View API Health
        </a>
      </div>
    </div>
  </div>

  <script>
    async function checkApiHealth() {
      const box = document.getElementById("status-box");
      try {
        const res = await fetch("/api/health");
        const data = await res.json();
        if (res.ok && data.status === "ok") {
          box.className = "alert alert-success d-flex align-items-center justify-content-center gap-2 mb-4";
          box.innerHTML = `<i class="bi bi-check-circle-fill"></i>
            <span>System Online &bull; Supabase ${data.supabase_configured ? "Configured" : "Pending Config"}</span>`;
        } else {
          throw new Error("Unexpected API response");
        }
      } catch (err) {
        box.className = "alert alert-danger d-flex align-items-center justify-content-center gap-2 mb-4";
        box.innerHTML = `<i class="bi bi-exclamation-triangle-fill"></i>
          <span>Unable to reach backend API</span>`;
      }
    }
    checkApiHealth();
  </script>
</body>
</html>
