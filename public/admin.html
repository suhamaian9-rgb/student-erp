<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin / HOD Dashboard — University ERP</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="erp-backdrop" class="erp-backdrop"></div>
  <div class="erp-layout">
    <aside id="erp-sidebar" class="erp-sidebar">
      <div class="sidebar-header d-flex align-items-center gap-2">
        <i data-lucide="graduation-cap" class="lucide-lg text-warning"></i>
        <div>
          <div class="fw-bold font-serif fs-5 lh-1">University ERP</div>
          <small id="sidebar-role-badge" class="role-chip">Admin / HOD</small>
        </div>
      </div>
      <nav id="sidebar-nav" class="nav flex-column py-2 overflow-auto"></nav>
    </aside>

    <div class="erp-main">
      <header class="erp-topbar">
        <div class="d-flex align-items-center gap-2 gap-sm-3 min-w-0">
          <button id="sidebar-toggle" class="btn btn-outline-secondary btn-sm d-lg-none" aria-label="Toggle Menu">
            <i data-lucide="menu"></i>
          </button>
          <h1 id="topbar-title" class="h5 mb-0 fw-semibold text-truncate">Dashboard</h1>
        </div>
        <div class="d-flex align-items-center gap-2 gap-sm-3 flex-shrink-0">
          <div class="dropdown">
            <button class="btn btn-light btn-sm position-relative" data-bs-toggle="dropdown" aria-label="Notifications">
              <i data-lucide="bell"></i>
              <span id="notif-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none"></span>
            </button>
            <div id="notif-list" class="dropdown-menu dropdown-menu-end shadow erp-notif-menu"></div>
          </div>
          <span id="topbar-user" class="small fw-medium d-none d-sm-inline"></span>
          <button id="logout-btn" class="btn btn-outline-danger btn-sm">
            <i data-lucide="log-out" class="me-1"></i> <span class="d-none d-sm-inline">Logout</span>
          </button>
        </div>
      </header>

      <main id="main-content" class="erp-content">
        <div class="text-center py-5 text-muted">
          <div class="spinner-border text-primary mb-2"></div>
          <div>Loading Admin Portal...</div>
        </div>
      </main>
    </div>
  </div>

  <!-- Reusable Admin Modal -->
  <div class="modal fade" id="adminModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 id="adminModalTitle" class="modal-title">Modal</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div id="adminModalBody" class="modal-body"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="/js/icons.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/admin.js" defer></script>
</body>
</html>
