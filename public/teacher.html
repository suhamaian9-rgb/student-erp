<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard — University ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="erp-backdrop" class="erp-backdrop"></div>
  <div class="erp-layout">
    <aside id="erp-sidebar" class="erp-sidebar">
      <div class="sidebar-header d-flex align-items-center gap-2">
        <i class="bi bi-mortarboard-fill fs-4 text-primary"></i>
        <div>
          <div class="fw-bold font-serif fs-5 lh-1">University ERP</div>
          <small id="sidebar-role-badge" class="role-chip">Teacher Portal</small>
        </div>
      </div>
      <nav id="sidebar-nav" class="nav flex-column py-2 overflow-auto"></nav>
    </aside>

    <div class="erp-main">
      <header class="erp-topbar">
        <div class="d-flex align-items-center gap-3">
          <button id="sidebar-toggle" class="btn btn-outline-secondary btn-sm d-lg-none" aria-label="Toggle Menu">
            <i class="bi bi-list fs-5"></i>
          </button>
          <h1 id="topbar-title" class="h5 mb-0 fw-semibold">Dashboard</h1>
        </div>
        <div class="d-flex align-items-center gap-3">
          <div class="dropdown">
            <button class="btn btn-light btn-sm position-relative" data-bs-toggle="dropdown" aria-label="Notifications">
              <i class="bi bi-bell"></i>
              <span id="notif-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="display:none"></span>
            </button>
            <div id="notif-list" class="dropdown-menu dropdown-menu-end shadow" style="width: 300px; max-height: 360px; overflow-y: auto;"></div>
          </div>
          <span id="topbar-user" class="small fw-medium d-none d-sm-inline"></span>
          <button id="logout-btn" class="btn btn-outline-danger btn-sm">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
          </button>
        </div>
      </header>

      <main id="main-content" class="erp-content">
        <div class="text-center py-5 text-muted">
          <div class="spinner-border text-primary mb-2"></div>
          <div>Loading Teacher Portal...</div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/profile-widget.js"></script>
  <script src="/js/teacher.js"></script>
</body>
</html>
