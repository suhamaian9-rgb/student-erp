<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — University ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="login-wrapper">
    <div class="card login-card p-4 p-md-5">
      <div class="text-center mb-4">
        <span class="brand-badge mb-3"><i class="bi bi-key-fill"></i></span>
        <h1 class="h4 fw-bold mb-1">Set New Password</h1>
        <p class="text-muted small">Choose a strong password for your account</p>
      </div>
      <div id="reset-alert" class="alert d-none"></div>
      <form id="reset-form">
        <div class="mb-3">
          <label for="new-password" class="form-label">New Password</label>
          <input type="password" id="new-password" class="form-control" minlength="6" required placeholder="Minimum 6 characters">
        </div>
        <div class="mb-4">
          <label for="confirm-password" class="form-label">Confirm Password</label>
          <input type="password" id="confirm-password" class="form-control" minlength="6" required placeholder="Re-enter password">
        </div>
        <button type="submit" class="btn btn-primary w-100">Update Password</button>
      </form>
      <div class="text-center mt-3">
        <a href="/" class="small text-decoration-none">Back to Sign In</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/app.js"></script>
  <script>
    const alertEl = document.getElementById("reset-alert");
    document.getElementById("reset-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pw = document.getElementById("new-password").value;
      const confirm = document.getElementById("confirm-password").value;
      if (pw !== confirm) {
        alertEl.className = "alert alert-danger";
        alertEl.textContent = "Passwords do not match.";
        alertEl.classList.remove("d-none");
        return;
      }
      try {
        const sb = await ERP.initSupabase();
        const { error } = await sb.auth.updateUser({ password: pw });
        if (error) throw error;
        alertEl.className = "alert alert-success";
        alertEl.textContent = "Password updated! Redirecting to sign in...";
        alertEl.classList.remove("d-none");
        setTimeout(() => (window.location.href = "/"), 2000);
      } catch (err) {
        alertEl.className = "alert alert-danger";
        alertEl.textContent = err.message;
        alertEl.classList.remove("d-none");
      }
    });
  </script>
</body>
</html>
